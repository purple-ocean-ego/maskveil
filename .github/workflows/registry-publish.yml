name: Publish to Comfy Registry

# 目的:
#   main の CI が成功したとき、`pyproject.toml` の version が未公開なら Comfy Registry へ公開する。
#
# 設計上の要点:
#   - **CI 成功後にのみ動かす**（`workflow_run`）。公開済みバージョンは削除できないため、
#     テスト未通過のコミットを公開しない。
#   - **version が公開済みならスキップ**する。`pyproject.toml` の非バージョン変更
#     （dev 依存の追加など）で publish を試みて失敗する事故を防ぐ。
#   - 手動実行は main に限定する（任意ブランチの内容を公開しない）。
#
# 前提:
#   - リポジトリ Secret `REGISTRY_ACCESS_TOKEN`（Comfy Registry の publisher API キー）

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-publish
  cancel-in-progress: false

env:
  COMFY_CLI: comfy-cli==1.24.0

jobs:
  publish:
    name: publish to registry
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Guard manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch は main でのみ実行できます（現在: ${GITHUB_REF}）"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # CI を通過したコミットを公開する（dispatch 時は既定の ref）
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check secret
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "${REGISTRY_ACCESS_TOKEN}" ]; then
            echo "::error::REGISTRY_ACCESS_TOKEN が未設定です（Settings > Secrets and variables > Actions）"
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: published
        run: |
          published=$(curl -s --max-time 30 "https://api.comfy.org/nodes/maskveil/versions" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if any(v.get('version') == sys.argv[1] for v in d) else 'no')" \
              "${{ steps.version.outputs.version }}")
          echo "published=${published}" >> "$GITHUB_OUTPUT"

      - name: Validate package metadata
        if: steps.published.outputs.published == 'no'
        run: uvx --from "${COMFY_CLI}" comfy node validate

      - name: Publish
        if: steps.published.outputs.published == 'no'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          echo "publishing version: ${{ steps.version.outputs.version }}"
          uvx --from "${COMFY_CLI}" comfy node publish --token "${REGISTRY_ACCESS_TOKEN}"

      - name: Skip (already published)
        if: steps.published.outputs.published == 'yes'
        run: echo "version ${{ steps.version.outputs.version }} は公開済みのためスキップします"
