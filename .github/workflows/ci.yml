name: CI

# 目的:
#   - lint（ruff check / ruff format --check）
#   - test マトリクス（Python 3.10 / 3.12 × torch 有 / 無）
#   - 配布物のビルドと内容検査、CLI の起動 smoke
#
# torch は ComfyUI が提供する依存のため pyproject には入れない（`nodes = []` の方針）。
# CI では「torch 無しでもコア＋CLI が動く」「torch 有りならノード契約テストも走る」の
# 両方を保証する。バージョンは CPU wheel の cp310 対応状況で Python ごとに異なるため、
# matrix の include で明示的に固定する（更新時は
# https://download.pytorch.org/whl/cpu/torch/ で cp310 wheel の有無を確認する）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --extra dev --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: test (py${{ matrix.python }}, torch=${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: none
            torch_spec: ""
            min_collected: 339
          - python: "3.10"
            torch: cpu
            torch_spec: "2.14.1+cpu"   # 2.15 系は cp310 wheel を提供しない
            min_collected: 431
          - python: "3.12"
            torch: none
            torch_spec: ""
            min_collected: 339
          - python: "3.12"
            torch: cpu
            torch_spec: "2.15.0+cpu"
            min_collected: 431
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --extra dev --locked
      - name: Install CPU torch
        if: matrix.torch == 'cpu'
        # pytorch の CPU index だけで torch とその依存が解決できる（PyPI を混ぜない）
        run: >
          uv pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==${{ matrix.torch_spec }}"
      - name: Check collected tests
        # torch の有無にかかわらず、収集件数が下限を下回ったら失敗させる
        run: |
          collected=$(uv run --no-sync pytest --collect-only 2>&1 \
            | grep -oE '^[0-9]+ tests collected' | grep -oE '^[0-9]+' || true)
          echo "collected=${collected:-<none>} (min=${{ matrix.min_collected }})"
          test -n "${collected}"
          test "${collected}" -ge ${{ matrix.min_collected }}
      - name: Assert node contract tests are collected
        if: matrix.torch == 'cpu'
        # `importorskip("torch")` の位置がずれるとノード契約テストが黙って消えるため、
        # 代表モジュールが収集されていることを直接確認する
        run: |
          uv run --no-sync pytest --collect-only 2>&1 | grep -q 'test_nodes_registry.py::' \
            || { echo "::error::ノード契約テストが収集されていません（importorskip の位置を確認）"; exit 1; }
      - name: pytest
        run: uv run --no-sync pytest

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Inspect artifacts
        run: |
          python3 - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          names = set(zipfile.ZipFile(wheels[0]).namelist())
          required = [
              "maskveil/__init__.py",
              "maskveil/core/pipeline.py",
              "maskveil/nodes/__init__.py",
              "maskveil/tools/censor.py",
              "maskveil/web/hotscreen_classes.js",
          ]
          missing = [name for name in required if name not in names]
          assert not missing, f"wheel に欠けているファイル: {missing}"

          # package-dir で `maskveil` の下へ寄せているため、パスは必ず `maskveil/` で始まる
          leaked = [n for n in names if n.startswith("tests/") or n.endswith(".onnx")]
          assert not leaked, f"wheel に配布対象外が混入: {leaked}"
          print(f"wheel OK: {wheels[0]} ({len(names)} entries)")

          with tarfile.open(sdists[0]) as archive:
              sdist_names = archive.getnames()
          prefix = sdist_names[0].split("/")[0] + "/"
          required_sdist = ["LICENSE", "README.md", "pyproject.toml", "web/hotscreen_classes.js"]
          missing_sdist = [p for p in required_sdist if prefix + p not in sdist_names]
          assert not missing_sdist, f"sdist に欠けているファイル: {missing_sdist}"
          leaked_sdist = [n for n in sdist_names if "/tests/" in n or n.endswith(".onnx")]
          assert not leaked_sdist, f"sdist に配布対象外が混入: {leaked_sdist}"
          print(f"sdist OK: {sdists[0]} ({len(sdist_names)} entries)")
          PY
      - name: Check metadata
        run: uvx twine check dist/*
      - name: CLI smoke (no torch)
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/maskveil --help > /dev/null
          /tmp/smoke/bin/maskveil-detect --help > /dev/null
          /tmp/smoke/bin/maskveil-refine --help > /dev/null
          /tmp/smoke/bin/python -c "import maskveil; print(maskveil.__version__ if hasattr(maskveil, '__version__') else 'ok')"
