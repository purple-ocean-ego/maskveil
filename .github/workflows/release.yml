name: Release

# 目的:
#   タグ（`v*`）を起点に、配布物をビルドし PyPI へ公開する。
#   PyPI へは Trusted Publishing（OIDC）で公開し、長期トークンを持たない。
#
# 前提:
#   - PyPI 側に Trusted Publisher を登録しておく
#       project: maskveil / owner: purple-ocean-ego / repository: maskveil
#       workflow: release.yml / environment: pypi
#   - タグ名は `pyproject.toml` の version と一致させる（例: version 0.1.0 → tag v0.1.0）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=${GITHUB_REF_NAME} version=${version}"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "::error::タグ名 (${GITHUB_REF_NAME}) と pyproject.toml の version (${version}) が一致しません"
            exit 1
          }

      - name: Build
        run: uv build

      - name: CLI smoke (no torch)
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/maskveil --help > /dev/null
          /tmp/smoke/bin/maskveil-detect --help > /dev/null
          /tmp/smoke/bin/maskveil-refine --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: github release
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
